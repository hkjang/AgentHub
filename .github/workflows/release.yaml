name: Offline Image Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          test "${version}" = "$(tr -d '\r\n' < VERSION)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build offline images
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build --build-arg VERSION="${RELEASE_VERSION}" --build-arg COMMIT="${GITHUB_SHA}" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t "agenthub:${RELEASE_TAG}" .
          docker build -f Dockerfile.base -t "agenthub-base:${RELEASE_TAG}" .
          mkdir -p release
          docker save "agenthub:${RELEASE_TAG}" | gzip -9 > "release/agenthub-${RELEASE_TAG}.tar.gz"
          docker save "agenthub-base:${RELEASE_TAG}" | gzip -9 > "release/agenthub-base-${RELEASE_TAG}.tar.gz"
      - name: Verify archives
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gzip -t "release/agenthub-${RELEASE_TAG}.tar.gz"
          gzip -t "release/agenthub-base-${RELEASE_TAG}.tar.gz"
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/agenthub-${{ steps.version.outputs.tag }}.tar.gz
            release/agenthub-base-${{ steps.version.outputs.tag }}.tar.gz
          fail_on_unmatched_files: true
