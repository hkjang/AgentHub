name: Offline Image Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AGENTHUB_IMAGE_CATALOG: runtime-images.json
      RELEASE_DIRECTORY: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tag history is required for source/version guards.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The runner context is unavailable while GitHub evaluates job-level env.
      # Resolve runner-local paths only after the job has started.
      - name: Configure release workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "AGENTHUB_RELEASE_INDEX=${RUNNER_TEMP}/agenthub-release-index.json" >> "$GITHUB_ENV"
          echo "AGENTHUB_IMAGE_PLAN=${RUNNER_TEMP}/agenthub-image-plan.json" >> "$GITHUB_ENV"
          echo "AGENTHUB_BUILT_IMAGES=${RUNNER_TEMP}/agenthub-built-images.txt" >> "$GITHUB_ENV"

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${tag#v}"
          test "${version}" = "$(tr -d '\r\n' < VERSION)"
          test "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not point to a commit on origin/main" >&2
            exit 1
          fi

      - name: Test release commit
        shell: bash
        env:
          AGENTHUB_BOOTSTRAP_ADMIN: ci-admin
          AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: ci-password-at-least-12
          AGENTHUB_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          set -euo pipefail
          go test -race ./cmd/... ./internal/...
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run build
          kubectl kustomize deploy/kubernetes >/dev/null
          docker compose config --quiet
          if env -u AGENTHUB_POSTGRES_DSN AGENTHUB_VERSION="${GITHUB_REF_NAME}" \
            docker compose -f deploy/offline/compose.yaml config --quiet 2>/dev/null; then
            echo '::error::offline Compose accepted a missing external PostgreSQL DSN' >&2
            exit 1
          fi
          AGENTHUB_VERSION="${GITHUB_REF_NAME}" \
          AGENTHUB_POSTGRES_DSN='postgres://agenthub:ci-password@postgres.example:5432/agenthub?sslmode=require' \
          docker compose -f deploy/offline/compose.yaml config --format json \
            > "${RUNNER_TEMP}/agenthub-offline-compose.json"
          jq -e '
            (.services | keys | sort) == ["agenthub", "agenthub-worker"] and
            all(.services[];
              (.image == ("agenthub:" + env.GITHUB_REF_NAME)) and
              ((.image // "") | ascii_downcase | contains("postgres") | not))
          ' "${RUNNER_TEMP}/agenthub-offline-compose.json" >/dev/null

      - name: Index published offline image archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/agenthub-release-pages.json"
          # gh writes one JSON array per page. jq --slurp combines those pages
          # into the GitHub release shape consumed by planning and manifests.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$raw"
          jq -s '
            (add // []) |
            map(select(.draft == false and .prerelease == false)) |
            sort_by(.published_at // "") | reverse |
            map({
              tag_name,
              draft,
              prerelease,
              published_at,
              assets: [.assets[]? | {
                id,
                name,
                size,
                digest,
                content_type,
                created_at,
                updated_at,
                browser_download_url
              }]
            })
          ' "$raw" > "$AGENTHUB_RELEASE_INDEX"
          jq -e 'type == "array" and all(.[]; has("tag_name") and has("assets"))' \
            "$AGENTHUB_RELEASE_INDEX" >/dev/null

      - name: Plan catalog image release
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git tag --merged "${GITHUB_SHA}" --list 'v*.*.*' |
            bash scripts/release-catalog-images.sh previous-tag)"
          export AGENTHUB_PREVIOUS_TAG="${previous}"
          echo "AGENTHUB_PREVIOUS_TAG=${previous}" >> "$GITHUB_ENV"
          bash scripts/release-catalog-images.sh plan

      - name: Reclaim runner disk
        shell: bash
        run: |
          # The runtime base is several GB before compression.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and smoke-check planned images
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/release-catalog-images.sh build
          echo 'Built image inventory:'
          sed 's/^/ - /' "$AGENTHUB_BUILT_IMAGES"

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Generate SPDX SBOMs for published images
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          {
            echo "agenthub:${RELEASE_TAG}"
            jq -r '.images[] | select(.publish) | .image + ":" + .tag' "$AGENTHUB_IMAGE_PLAN"
          } | while IFS= read -r reference; do
            [ -n "${reference}" ] || continue
            if ! grep -Fqx -- "$reference" "$AGENTHUB_BUILT_IMAGES"; then
              echo "::error::publish image was not recorded as built: ${reference}" >&2
              exit 1
            fi
            asset="${reference/:/-}.spdx.json"
            [[ "${asset}" =~ ^agenthub-[A-Za-z0-9_.-]+\.spdx\.json$ ]]
            syft scan "docker:${reference}" --output "spdx-json=release/${asset}"
          done

      - name: Package planned image archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/release-catalog-images.sh package
          ls -lh release
          df -h /

      - name: Build offline manifest and deployment assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o release/agenthub-offline-linux-amd64 ./cmd/agenthub-offline
          install -m 0644 deploy/offline/compose.yaml release/agenthub-offline-compose.yaml
          install -m 0644 deploy/offline/.env.example release/agenthub-offline.env.example
          release/agenthub-offline-linux-amd64 manifest \
            --release "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --catalog runtime-images.json \
            --release-index "$AGENTHUB_RELEASE_INDEX" \
            --local-assets release \
            --deployment-file agenthub-offline-compose.yaml=deploy/offline/compose.yaml \
            --deployment-file agenthub-offline.env.example=deploy/offline/.env.example \
            --deployment-file agenthub-offline-linux-amd64=release/agenthub-offline-linux-amd64 \
            --output release/offline-bundle.json
          jq -e '
            .release == env.RELEASE_TAG and
            (all(.images[]; ((.id + " " + .image) | ascii_downcase | contains("postgres") | not))) and
            (any(.prerequisites[];
              .id == "postgresql" and .required == true and .bundled == false and
              .dsnEnv == "AGENTHUB_POSTGRES_DSN"))
          ' release/offline-bundle.json >/dev/null

      - name: Checksum and verify release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if find release -maxdepth 1 -type f -iname '*postgres*' -print -quit | grep -q .; then
            echo '::error::PostgreSQL must remain an external prerequisite and cannot be a release asset' >&2
            exit 1
          fi
          # The Sigstore bundle is generated from these checksums in the next
          # step, so it cannot recursively attest/checksum itself.
          (
            cd release
            find . -maxdepth 1 -type f \
              ! -name SHA256SUMS \
              ! -name '*.provenance.sigstore.json' \
              -printf '%P\0' |
              LC_ALL=C sort -z |
              xargs -0 sha256sum -- > SHA256SUMS
          )
          bash scripts/release-catalog-images.sh verify

      - name: Attest release asset checksums
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Add Sigstore attestation bundle to release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$ATTESTATION_BUNDLE"
          install -m 0644 "$ATTESTATION_BUNDLE" \
            "release/agenthub-${RELEASE_TAG}.provenance.sigstore.json"
          oversized="$(find release -maxdepth 1 -type f -size +2047M -print)"
          if [ -n "$oversized" ]; then
            echo "::error::release asset exceeds GitHub's 2 GiB limit: ${oversized}" >&2
            exit 1
          fi

      - name: Generate catalog-based release notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          delimiter="AGENTHUB_RELEASE_NOTE_${GITHUB_RUN_ID}"
          {
            echo "body<<${delimiter}"
            bash scripts/release-catalog-images.sh notes
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
          files: release/*
          fail_on_unmatched_files: true
