name: Offline Image Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tag history is needed to diff this release against the previous one.
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          test "${version}" = "$(tr -d '\r\n' < VERSION)"
          base="$(tr -d '\r\n' < BASE_VERSION)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          langflow="$(tr -d '\r\n' < LANGFLOW_VERSION)"
          qwencode="$(tr -d '\r\n' < QWENCODE_VERSION)"
          echo "baseVersion=${base}" >> "$GITHUB_OUTPUT"
          echo "baseTag=v${base}" >> "$GITHUB_OUTPUT"
          echo "langflowVersion=${langflow}" >> "$GITHUB_OUTPUT"
          echo "langflowTag=v${langflow}" >> "$GITHUB_OUTPUT"
          echo "qwencodeVersion=${qwencode}" >> "$GITHUB_OUTPUT"
          echo "qwencodeTag=v${qwencode}" >> "$GITHUB_OUTPUT"
      - name: Decide whether the runtime base image must be rebuilt
        id: base
        shell: bash
        env:
          BASE_VERSION: ${{ steps.version.outputs.baseVersion }}
        run: |
          set -euo pipefail
          # The base image is several GB and dominates release time, so it is
          # published only when BASE_VERSION says it changed. Changing what it
          # is built from without bumping BASE_VERSION is a mistake: the control
          # plane would keep pointing at a tag whose image no longer matches.
          sources=(Dockerfile.base deploy/runtime cmd/runtime-proxy)
          previous="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          if [ -z "${previous}" ]; then
            echo "no previous release tag; building the base image"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "comparing ${previous}..${GITHUB_REF_NAME}"
          previous_base="$(git show "${previous}:BASE_VERSION" 2>/dev/null | tr -d '\r\n' || true)"
          inputs_changed=false
          if ! git diff --quiet "${previous}" "${GITHUB_REF_NAME}" -- "${sources[@]}"; then
            git diff --name-only "${previous}" "${GITHUB_REF_NAME}" -- "${sources[@]}"
            inputs_changed=true
          fi
          # Dependency files matter only when they move a module the proxy in
          # the base image actually compiles. Treating every go.mod edit as a
          # base change forced a multi-gigabyte rebuild for dependencies the
          # image never links — which is the cost this whole mechanism exists
          # to avoid.
          if [ "${inputs_changed}" = false ] && ! git diff --quiet "${previous}" "${GITHUB_REF_NAME}" -- go.mod go.sum; then
            if ! modules="$(go list -deps -f '{{if .Module}}{{.Module.Path}}{{end}}' ./cmd/runtime-proxy | sort -u)"; then
              # Unable to tell: assume the base image is affected rather than
              # publishing a release whose base tag may be stale.
              echo "could not resolve the proxy's module graph; treating the dependency change as a base change"
              modules=""
              inputs_changed=true
            fi
            moved="$(git diff -U0 "${previous}" "${GITHUB_REF_NAME}" -- go.mod go.sum \
              | grep -E '^[+-][^+-]' | grep -oE '[a-z0-9.-]+\.[a-z]{2,}/[^ ]+' | sed 's/ .*//' | sort -u || true)"
            hit=false
            for module in ${moved}; do
              if printf '%s\n' "${modules}" | grep -qx "${module}"; then
                echo "dependency ${module} is compiled into the base image"
                hit=true
              fi
            done
            if [ "${hit}" = true ]; then
              inputs_changed=true
            else
              echo "go.mod/go.sum changed, but no module the base image compiles moved"
            fi
          fi
          if [ "${inputs_changed}" = true ] && [ "${BASE_VERSION}" = "${previous_base}" ]; then
            echo "::error::base image sources changed since ${previous} but BASE_VERSION is still ${BASE_VERSION}; bump BASE_VERSION so the new image gets its own tag" >&2
            exit 1
          fi
          if [ "${BASE_VERSION}" = "${previous_base}" ]; then
            echo "base image v${BASE_VERSION} is unchanged since ${previous}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          else
            echo "base image moves from v${previous_base:-none} to v${BASE_VERSION}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether the Langflow runtime image must be rebuilt
        id: langflow
        shell: bash
        env:
          LANGFLOW_VERSION: ${{ steps.version.outputs.langflowVersion }}
        run: |
          set -euo pipefail
          # Same rule as the base image, and for the same reason: this one is
          # about a gigabyte, only sites that run Langflow agents need it, and a
          # control plane pointing at a tag that was never published is worse
          # than one pointing at an older tag that exists.
          #
          # Its inputs are only its Dockerfile and the reporter script it copies.
          # It compiles nothing, so no Go module can move it.
          sources=(Dockerfile.langflow deploy/runtime/agenthub-report-config.sh)
          previous="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          if [ -z "${previous}" ]; then
            echo "no previous release tag; building the Langflow image"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          previous_version="$(git show "${previous}:LANGFLOW_VERSION" 2>/dev/null | tr -d '\r\n' || true)"
          inputs_changed=false
          if [ -z "${previous_version}" ]; then
            # The previous release did not ship this image at all.
            inputs_changed=true
          elif ! git diff --quiet "${previous}" "${GITHUB_REF_NAME}" -- "${sources[@]}"; then
            git diff --name-only "${previous}" "${GITHUB_REF_NAME}" -- "${sources[@]}"
            inputs_changed=true
          fi
          if [ "${inputs_changed}" = true ] && [ "${LANGFLOW_VERSION}" = "${previous_version}" ]; then
            echo "::error::Langflow image sources changed since ${previous} but LANGFLOW_VERSION is still ${LANGFLOW_VERSION}; bump LANGFLOW_VERSION so the new image gets its own tag" >&2
            exit 1
          fi
          if [ "${LANGFLOW_VERSION}" = "${previous_version}" ]; then
            echo "Langflow image v${LANGFLOW_VERSION} is unchanged since ${previous}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Langflow image moves from v${previous_version:-none} to v${LANGFLOW_VERSION}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether the Qwen Code runtime image must be rebuilt
        id: qwencode
        shell: bash
        env:
          QWENCODE_VERSION: ${{ steps.version.outputs.qwencodeVersion }}
        run: |
          set -euo pipefail
          # Same rule as the other two images. Its inputs are its Dockerfile and
          # the scripts it copies; it compiles nothing, so no Go module moves it.
          sources=(Dockerfile.qwencode deploy/runtime/agenthub-report-config.sh deploy/runtime/qwencode-configure.sh deploy/runtime/qwencode-shell.sh deploy/runtime/qwencode-run.sh deploy/runtime/qwencode-toolchain.sh)
          previous="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          if [ -z "${previous}" ]; then
            echo "no previous release tag; building the Qwen Code image"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          previous_version="$(git show "${previous}:QWENCODE_VERSION" 2>/dev/null | tr -d '\r\n' || true)"
          inputs_changed=false
          if [ -z "${previous_version}" ]; then
            inputs_changed=true
          elif ! git diff --quiet "${previous}" "${GITHUB_REF_NAME}" -- "${sources[@]}"; then
            git diff --name-only "${previous}" "${GITHUB_REF_NAME}" -- "${sources[@]}"
            inputs_changed=true
          fi
          if [ "${inputs_changed}" = true ] && [ "${QWENCODE_VERSION}" = "${previous_version}" ]; then
            echo "::error::Qwen Code image sources changed since ${previous} but QWENCODE_VERSION is still ${QWENCODE_VERSION}; bump QWENCODE_VERSION so the new image gets its own tag" >&2
            exit 1
          fi
          if [ "${QWENCODE_VERSION}" = "${previous_version}" ]; then
            echo "Qwen Code image v${QWENCODE_VERSION} is unchanged since ${previous}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Qwen Code image moves from v${previous_version:-none} to v${QWENCODE_VERSION}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim runner disk
        shell: bash
        run: |
          # The runtime base image is several GB before compression, so the
          # hosted runner's preinstalled toolchains have to go first.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      - uses: docker/setup-buildx-action@v4
      - name: Build offline images
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BASE_VERSION: ${{ steps.version.outputs.baseVersion }}
          BASE_TAG: ${{ steps.version.outputs.baseTag }}
          BASE_CHANGED: ${{ steps.base.outputs.changed }}
          BASE_PREVIOUS: ${{ steps.base.outputs.previous }}
          LANGFLOW_VERSION: ${{ steps.version.outputs.langflowVersion }}
          LANGFLOW_TAG: ${{ steps.version.outputs.langflowTag }}
          LANGFLOW_CHANGED: ${{ steps.langflow.outputs.changed }}
          LANGFLOW_PREVIOUS: ${{ steps.langflow.outputs.previous }}
          QWENCODE_VERSION: ${{ steps.version.outputs.qwencodeVersion }}
          QWENCODE_TAG: ${{ steps.version.outputs.qwencodeTag }}
          QWENCODE_CHANGED: ${{ steps.qwencode.outputs.changed }}
          QWENCODE_PREVIOUS: ${{ steps.qwencode.outputs.previous }}
        run: |
          docker build --build-arg VERSION="${RELEASE_VERSION}" --build-arg BASE_VERSION="${BASE_VERSION}" --build-arg LANGFLOW_VERSION="${LANGFLOW_VERSION}" --build-arg QWENCODE_VERSION="${QWENCODE_VERSION}" --build-arg COMMIT="${GITHUB_SHA}" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t "agenthub:${RELEASE_TAG}" .
          if [ "${BASE_CHANGED}" = "true" ]; then
            docker build -f Dockerfile.base -t "agenthub-base:${BASE_TAG}" .
          else
            echo "skipping the runtime base image build; ${BASE_TAG} from ${BASE_PREVIOUS} still applies"
          fi
          if [ "${LANGFLOW_CHANGED}" = "true" ]; then
            docker build -f Dockerfile.langflow -t "agenthub-langflow:${LANGFLOW_TAG}" .
          else
            echo "skipping the Langflow runtime image build; ${LANGFLOW_TAG} from ${LANGFLOW_PREVIOUS} still applies"
          fi
          if [ "${QWENCODE_CHANGED}" = "true" ]; then
            docker build -f Dockerfile.qwencode -t "agenthub-qwencode:${QWENCODE_TAG}" .
          else
            echo "skipping the Qwen Code runtime image build; ${QWENCODE_TAG} from ${QWENCODE_PREVIOUS} still applies"
          fi
      - name: Package archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BASE_TAG: ${{ steps.version.outputs.baseTag }}
          BASE_CHANGED: ${{ steps.base.outputs.changed }}
          LANGFLOW_TAG: ${{ steps.version.outputs.langflowTag }}
          LANGFLOW_CHANGED: ${{ steps.langflow.outputs.changed }}
          QWENCODE_TAG: ${{ steps.version.outputs.qwencodeTag }}
          QWENCODE_CHANGED: ${{ steps.qwencode.outputs.changed }}
        run: |
          set -euo pipefail
          mkdir -p release
          # A GitHub release asset may not exceed 2 GiB, and the runtime base
          # image compresses to more than that. Stream save|gzip straight into
          # split so the whole archive never lands on the runner's disk, then
          # collapse the single-part case back to a plain .tar.gz.
          package() {
            local image="$1" archive="release/$2"
            docker save "${image}" | gzip -9 | split -b 1900M - "${archive}.part-"
            local parts=("${archive}".part-*)
            if [ "${#parts[@]}" -eq 1 ]; then
              mv "${parts[0]}" "${archive}"
              echo "packaged ${image} -> ${archive} (single file)"
            else
              echo "packaged ${image} -> ${#parts[@]} parts of ${archive}"
            fi
            # The image is no longer needed and the runner is disk constrained.
            docker image rm "${image}" >/dev/null 2>&1 || true
          }
          package "agenthub:${RELEASE_TAG}" "agenthub-${RELEASE_TAG}.tar.gz"
          if [ "${BASE_CHANGED}" = "true" ]; then
            package "agenthub-base:${BASE_TAG}" "agenthub-base-${BASE_TAG}.tar.gz"
          fi
          if [ "${LANGFLOW_CHANGED}" = "true" ]; then
            package "agenthub-langflow:${LANGFLOW_TAG}" "agenthub-langflow-${LANGFLOW_TAG}.tar.gz"
          fi
          if [ "${QWENCODE_CHANGED}" = "true" ]; then
            package "agenthub-qwencode:${QWENCODE_TAG}" "agenthub-qwencode-${QWENCODE_TAG}.tar.gz"
          fi
          # Glob only the archives: including SHA256SUMS in its own listing is
          # both meaningless and racy with the redirect.
          ( cd release && sha256sum -- agenthub-* > SHA256SUMS )
          ls -lh release
          df -h /
      - name: Verify archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BASE_TAG: ${{ steps.version.outputs.baseTag }}
          LANGFLOW_TAG: ${{ steps.version.outputs.langflowTag }}
          QWENCODE_TAG: ${{ steps.version.outputs.qwencodeTag }}
        run: |
          set -euo pipefail
          ( cd release && sha256sum -c SHA256SUMS )
          # Reassemble through a pipe: this proves the parts concatenate back
          # into a valid archive without needing room for a second copy.
          for name in "agenthub-${RELEASE_TAG}.tar.gz" "agenthub-base-${BASE_TAG}.tar.gz" "agenthub-langflow-${LANGFLOW_TAG}.tar.gz" "agenthub-qwencode-${QWENCODE_TAG}.tar.gz"; do
            if [ -z "$(ls -d release/"${name}"* 2>/dev/null)" ]; then
              echo "skipped ${name}"
              continue
            fi
            if [ -f "release/${name}" ]; then
              gzip -t "release/${name}"
              echo "verified ${name}"
            else
              cat release/"${name}".part-* | gzip -t
              echo "verified $(ls release/"${name}".part-* | wc -l) parts of ${name}"
            fi
          done
          # Every asset must be under GitHub's 2 GiB per-file limit.
          oversized="$(find release -maxdepth 1 -type f -size +2047M)"
          if [ -n "${oversized}" ]; then
            echo "asset exceeds the 2 GiB GitHub limit: ${oversized}" >&2
            exit 1
          fi
      - name: Note the base image this release runs on
        id: notes
        shell: bash
        env:
          BASE_CHANGED: ${{ steps.base.outputs.changed }}
          BASE_PREVIOUS: ${{ steps.base.outputs.previous }}
          BASE_TAG: ${{ steps.version.outputs.baseTag }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          LANGFLOW_TAG: ${{ steps.version.outputs.langflowTag }}
          LANGFLOW_CHANGED: ${{ steps.langflow.outputs.changed }}
          LANGFLOW_PREVIOUS: ${{ steps.langflow.outputs.previous }}
          QWENCODE_TAG: ${{ steps.version.outputs.qwencodeTag }}
          QWENCODE_CHANGED: ${{ steps.qwencode.outputs.changed }}
          QWENCODE_PREVIOUS: ${{ steps.qwencode.outputs.previous }}
        run: |
          {
            echo 'body<<RELEASE_NOTE'
            echo "이 릴리즈가 사용하는 런타임 base 이미지: \`agenthub-base:${BASE_TAG}\`"
            echo ""
            if [ "${BASE_CHANGED}" = "true" ]; then
              echo "base 이미지가 갱신되어 \`agenthub-base-${BASE_TAG}.tar.gz\`로 함께 게시됩니다."
            else
              echo "base 이미지는 **변경 없음**입니다. 이미 설치된 \`agenthub-base:${BASE_TAG}\`를 그대로 사용하세요. 새로 받아야 한다면 ${BASE_PREVIOUS} 이전 릴리즈의 \`agenthub-base-${BASE_TAG}.tar.gz\` 자산을 내려받으면 됩니다."
              echo ""
              echo "base 이미지는 용량이 커서 \`BASE_VERSION\`이 올라간 릴리즈에서만 다시 게시합니다."
            fi
            echo ""
            echo "Langflow Runtime 이미지: \`agenthub-langflow:${LANGFLOW_TAG}\` — Langflow Agent를 쓰는 사이트만 필요합니다."
            if [ "${LANGFLOW_CHANGED}" = "true" ]; then
              echo "이번 릴리즈에 \`agenthub-langflow-${LANGFLOW_TAG}.tar.gz\`로 함께 게시됩니다."
            else
              echo "변경 없음입니다. 이미 설치된 \`agenthub-langflow:${LANGFLOW_TAG}\`를 그대로 사용하세요(직전 게시는 ${LANGFLOW_PREVIOUS} 이전 릴리즈의 같은 이름 자산입니다)."
            fi
            echo ""
            echo "Qwen Code Runtime 이미지: \`agenthub-qwencode:${QWENCODE_TAG}\` — Qwen Code Agent를 쓰는 사이트만 필요합니다."
            if [ "${QWENCODE_CHANGED}" = "true" ]; then
              echo "이번 릴리즈에 \`agenthub-qwencode-${QWENCODE_TAG}.tar.gz\`로 함께 게시됩니다."
            else
              echo "변경 없음입니다. 이미 설치된 \`agenthub-qwencode:${QWENCODE_TAG}\`를 그대로 사용하세요(직전 게시는 ${QWENCODE_PREVIOUS} 이전 릴리즈의 같은 이름 자산입니다)."
            fi
            echo 'RELEASE_NOTE'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
          files: release/*
          fail_on_unmatched_files: true
