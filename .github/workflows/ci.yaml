name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and history, because the image source guard below compares this
          # commit with the last release.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # -race, because the engine runs a level's steps in parallel and a race in
      # that path would otherwise only show up as a flaky production run.
      - run: go test -race ./cmd/... ./internal/...
      - run: npm ci && npm run lint && npm run build
        working-directory: web
      # The release refuses an image whose sources changed under a version that
      # says they did not. That check used to run only after a tag was pushed,
      # so the author learned about it by watching a release fail and paid for
      # it with a second version. It needs only git and the catalog.
      - run: bash scripts/release-catalog-images.sh check-versions
      - run: kubectl kustomize deploy/kubernetes >/dev/null
      - run: docker compose config --quiet
        env:
          AGENTHUB_BOOTSTRAP_ADMIN: ci-admin
          AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: ci-password-at-least-12
          AGENTHUB_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
