name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # -race, because the engine runs a level's steps in parallel and a race in
      # that path would otherwise only show up as a flaky production run.
      - run: go test -race ./cmd/... ./internal/...
      - run: npm ci && npm run lint && npm run build
        working-directory: web
      - run: kubectl kustomize deploy/kubernetes >/dev/null
      - run: docker compose config --quiet
        env:
          AGENTHUB_BOOTSTRAP_ADMIN: ci-admin
          AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: ci-password-at-least-12
          AGENTHUB_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
