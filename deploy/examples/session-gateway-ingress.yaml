# Replace hostnames and secretName, then apply outside the base Kustomization.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenthub-session-gateway
  namespace: agent-platform-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agenthub.company.local
        - "*.agents.company.local"
      secretName: agenthub-wildcard-tls
  rules:
    - host: agenthub.company.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agenthub
                port: {name: http}
    - host: "*.agents.company.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agenthub
                port: {name: http}
