apiVersion: v1
kind: Secret
metadata:
  name: agenthub-bootstrap
  namespace: agent-platform-system
type: Opaque
stringData:
  AGENTHUB_POSTGRES_DSN: postgres://agenthub:replace-me@postgres.internal:5432/agenthub
  AGENTHUB_BOOTSTRAP_ADMIN: admin
  AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: replace-with-at-least-12-characters
  AGENTHUB_ENCRYPTION_KEY: replace-with-base64-encoded-32-byte-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub
  namespace: agent-platform-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: agenthub}
  template:
    metadata:
      labels: {app: agenthub}
    spec:
      serviceAccountName: agenthub
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agenthub
          image: agenthub:v0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: agenthub-bootstrap}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub
  namespace: agent-platform-system
spec:
  selector: {app: agenthub}
  ports:
    - {name: http, port: 8080, targetPort: http}
