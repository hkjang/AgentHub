apiVersion: v1
kind: Secret
metadata:
  name: agenthub-bootstrap
  namespace: agent-platform-system
type: Opaque
stringData:
  # PostgreSQL is operated outside this deployment. Replace this example using
  # the cluster's secret management process before applying the manifests.
  AGENTHUB_POSTGRES_DSN: postgres://agenthub:REPLACE_ME@postgres.example.internal:5432/agenthub?sslmode=verify-full
  AGENTHUB_BOOTSTRAP_ADMIN: admin
  AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: local-development-password
  AGENTHUB_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub
  namespace: agent-platform-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: agenthub}
  template:
    metadata:
      labels: {app: agenthub}
    spec:
      serviceAccountName: agenthub
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agenthub
          image: agenthub:v0.228.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: agenthub-bootstrap}
          env:
            # AgentHub's sidecars run the control plane's own image. Change this
            # together with the image above when deploying from a registry.
            - {name: AGENTHUB_SIDECAR_IMAGE, value: "agenthub:v0.228.0"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub
  namespace: agent-platform-system
spec:
  selector: {app: agenthub}
  ports:
    - {name: http, port: 8080, targetPort: http}
