apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-runtime-dev
  labels:
    # hostNetwork is forbidden by both the baseline and restricted Pod Security
    # profiles. Runtime Pods still receive restricted security contexts from the
    # Operator, while audit/warn keep reporting any drift from that profile.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
