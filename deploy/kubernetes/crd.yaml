apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentruntimes.agenthub.io
spec:
  group: agenthub.io
  scope: Namespaced
  names:
    plural: agentruntimes
    singular: agentruntime
    kind: AgentRuntime
    shortNames: [ar]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Runtime
          type: string
          jsonPath: .spec.runtime.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [owner, runtime, lifecycle]
              properties:
                owner: {type: string, minLength: 1}
                agentRef:
                  type: object
                  properties:
                    id: {type: string}
                    version: {type: integer, minimum: 1}
                runtime:
                  type: object
                  required: [type, image]
                  properties:
                    # Keep in sync with internal/runtimetype.Supported.
                    type: {type: string, enum: [opencode, hermes, qwenpaw, custom]}
                    image: {type: string, minLength: 1}
                    # AgentHub's own sidecars run this image rather than the
                    # runtime image, so pinning an agent to an older runtime
                    # cannot pin the platform's code with it. Empty falls back
                    # to the runtime image.
                    sidecarImage: {type: string}
                profile:
                  type: object
                  properties:
                    cpuMillis: {type: integer, minimum: 100}
                    memoryMb: {type: integer, minimum: 128}
                    storageGb: {type: integer, minimum: 1}
                    gpuCount: {type: integer, minimum: 0}
                    idleTimeoutSeconds: {type: integer, minimum: 0}
                workspace:
                  type: object
                  properties:
                    type: {type: string, enum: [empty, git, persistent, template, snapshot]}
                    pvcName: {type: string}
                    sizeGb: {type: integer, minimum: 1}
                    repositoryUrl: {type: string}
                    branch: {type: string}
                    snapshotName: {type: string}
                    # How the clone authenticates against a private repository.
                    # The credential is read from the runtime Secret, never here.
                    gitCredentialKind: {type: string, enum: ["", token, ssh-key]}
                    gitCredentialUsername: {type: string}
                model:
                  type: object
                  properties:
                    baseUrl: {type: string}
                    name: {type: string}
                    secretRef: {type: string}
                mcp:
                  type: array
                  items:
                    type: object
                    required: [name, mode]
                    properties:
                      name: {type: string}
                      mode: {type: string, enum: [shared, dedicated, sidecar]}
                      endpoint: {type: string}
                      image: {type: string}
                      port: {type: integer, minimum: 1, maximum: 65535, default: 8000}
                      # How the runtime authenticates to this MCP server. The
                      # credential itself lives in the runtime Secret; only the
                      # key that holds it is named here.
                      authType: {type: string, enum: [none, bearer, header, basic], default: none}
                      authHeader: {type: string}
                      credentialKey: {type: string}
                      # Which of this server's tools the agent may call. When
                      # present the binding is routed through the in-Pod egress
                      # gateway, so the agent process cannot reach the server
                      # directly and cannot call what it is not allowed to.
                      toolPolicy:
                        type: object
                        required: [mode]
                        properties:
                          mode: {type: string, enum: [allow, deny]}
                          tools:
                            type: array
                            items: {type: string}
                security:
                  type: object
                  properties:
                    runAsNonRoot: {type: boolean, default: true}
                    readOnlyRootFilesystem: {type: boolean, default: true}
                    allowPrivilegeEscalation: {type: boolean, enum: [false], default: false}
                    automountServiceAccountToken: {type: boolean, enum: [false], default: false}
                    seccompProfile: {type: string, enum: [RuntimeDefault], default: RuntimeDefault}
                network:
                  type: object
                  properties:
                    defaultDeny: {type: boolean, default: true}
                    allowDNS: {type: boolean, default: true}
                    allowedDestinations:
                      type: array
                      maxItems: 64
                      items: {type: string}
                lifecycle:
                  type: object
                  required: [desiredState]
                  properties:
                    desiredState: {type: string, enum: [Running, Stopped]}
                    autoRestart: {type: boolean}
                    idleTimeoutSeconds: {type: integer, minimum: 0}
            status:
              type: object
              properties:
                phase: {type: string}
                podName: {type: string}
                nodeName: {type: string}
                endpoint: {type: string}
                restartCount: {type: integer, minimum: 0}
                failureReason: {type: string}
                observedGeneration: {type: integer, format: int64}
                lastTransitionTime: {type: string}
