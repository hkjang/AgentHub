apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentruntimes.agenthub.io
spec:
  group: agenthub.io
  scope: Namespaced
  names:
    plural: agentruntimes
    singular: agentruntime
    kind: AgentRuntime
    shortNames: [ar]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Runtime
          type: string
          jsonPath: .spec.runtime.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [owner, runtime, lifecycle]
              properties:
                owner: {type: string, minLength: 1}
                agentRef:
                  type: object
                  properties:
                    id: {type: string}
                    version: {type: integer, minimum: 1}
                # The control plane's own id for this runtime. The in-Pod gateway
                # sends it when it has to ask for a tool approval, so the request
                # can be tied back to the agent and its owner.
                runtimeRef:
                  type: object
                  properties:
                    id: {type: string}
                runtime:
                  type: object
                  required: [type, image]
                  properties:
                    # Keep in sync with internal/runtimetype.Supported.
                    type: {type: string, enum: [opencode, hermes, qwenpaw, qwencode, goose, jupyter, langflow, nodered, n8n, custom]}
                    image: {type: string, minLength: 1}
                    # AgentHub's own sidecars run this image rather than the
                    # runtime image, so pinning an agent to an older runtime
                    # cannot pin the platform's code with it. Empty falls back
                    # to the runtime image.
                    sidecarImage: {type: string}
                    # A custom runtime has no adapter, so it declares how it
                    # starts and which port it serves on. Ignored for every
                    # other runtime type.
                    command:
                      type: array
                      items: {type: string}
                    port: {type: integer, minimum: 1, maximum: 65535}
                profile:
                  type: object
                  properties:
                    cpuMillis: {type: integer, minimum: 100}
                    memoryMb: {type: integer, minimum: 128}
                    storageGb: {type: integer, minimum: 1}
                    gpuCount: {type: integer, minimum: 0}
                    idleTimeoutSeconds: {type: integer, minimum: 0}
                workspace:
                  type: object
                  properties:
                    type: {type: string, enum: [empty, git, persistent, template, snapshot]}
                    pvcName: {type: string}
                    sizeGb: {type: integer, minimum: 1}
                    repositoryUrl: {type: string}
                    branch: {type: string}
                    snapshotName: {type: string}
                    # How the clone authenticates against a private repository.
                    # The credential is read from the runtime Secret, never here.
                    gitCredentialKind: {type: string, enum: ["", token, ssh-key]}
                    gitCredentialUsername: {type: string}
                model:
                  type: object
                  properties:
                    baseUrl: {type: string}
                    name: {type: string}
                    secretRef: {type: string}
                mcp:
                  type: array
                  items:
                    type: object
                    required: [name, mode]
                    properties:
                      name: {type: string}
                      mode: {type: string, enum: [shared, dedicated, sidecar]}
                      endpoint: {type: string}
                      image: {type: string}
                      port: {type: integer, minimum: 1, maximum: 65535, default: 8000}
                      # How the runtime authenticates to this MCP server. The
                      # credential itself lives in the runtime Secret; only the
                      # key that holds it is named here.
                      authType: {type: string, enum: [none, bearer, header, basic], default: none}
                      authHeader: {type: string}
                      credentialKey: {type: string}
                      # Which of this server's tools the agent may call. When
                      # present the binding is routed through the in-Pod egress
                      # gateway, so the agent process cannot reach the server
                      # directly and cannot call what it is not allowed to.
                      toolPolicy:
                        type: object
                        properties:
                          mode: {type: string, enum: [allow, deny]}
                          tools:
                            type: array
                            items: {type: string}
                          # Tools that need a person's decision before they run.
                          # The gateway holds the call open while it asks the
                          # control plane, so an agent that never declares what it
                          # is about to do is gated anyway.
                          approvalTools:
                            type: array
                            items: {type: string}
                          # Every tool on this server needs that decision, which is
                          # what an approval-required or high-risk catalogue entry
                          # means.
                          approvalRequired: {type: boolean, default: false}
                          # Patterns compiled from the platform-wide policy, kept
                          # apart from the per-agent list above: one is the
                          # platform's statement and the other the agent owner's.
                          # A trailing * is the only wildcard, matched against both
                          # "tool" and "server/tool".
                          policyDenied:
                            type: array
                            maxItems: 200
                            items: {type: string, maxLength: 200}
                          policyGated:
                            type: array
                            maxItems: 200
                            items: {type: string, maxLength: 200}
                          # A policy rule that named no tool at all covers every
                          # tool the server offers, including ones nobody has seen.
                          policyDenyAll: {type: boolean, default: false}
                security:
                  type: object
                  properties:
                    runAsNonRoot: {type: boolean, default: true}
                    readOnlyRootFilesystem: {type: boolean, default: true}
                    allowPrivilegeEscalation: {type: boolean, enum: [false], default: false}
                    automountServiceAccountToken: {type: boolean, enum: [false], default: false}
                    seccompProfile: {type: string, enum: [RuntimeDefault], default: RuntimeDefault}
                network:
                  type: object
                  properties:
                    defaultDeny: {type: boolean, default: true}
                    allowDNS: {type: boolean, default: true}
                    allowedDestinations:
                      type: array
                      maxItems: 64
                      items: {type: string}
                # Files and environment variables every runtime Pod is
                # provisioned with, configured once in Admin ▸ Settings ▸
                # Runtime Environment. Rendered into a ConfigMap and read by
                # every container, so nothing here may be a secret.
                provisioning:
                  type: object
                  properties:
                    files:
                      type: array
                      maxItems: 32
                      items:
                        type: object
                        required: [path]
                        properties:
                          # Absolute path inside the container. Paths the
                          # platform owns are rejected by the control plane and
                          # dropped by the operator.
                          path: {type: string, minLength: 2, maxLength: 512, pattern: '^/'}
                          content: {type: string, maxLength: 65536}
                          mode: {type: string, pattern: '^0?[0-7]{3}$', default: '0644'}
                    env:
                      type: array
                      maxItems: 64
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
                          value: {type: string, maxLength: 4096}
                # What the in-Pod gateway inspects on the way out. Scanning is
                # done there because it is the one place the agent process cannot
                # route around.
                dlp:
                  type: object
                  properties:
                    enabled: {type: boolean, default: false}
                    scanResponses: {type: boolean, default: false}
                    maxBytes: {type: integer, minimum: 0, maximum: 4194304}
                    classes:
                      type: array
                      maxItems: 32
                      items:
                        type: object
                        required: [class, action]
                        properties:
                          class: {type: string, maxLength: 40}
                          action: {type: string, enum: [off, audit, redact, block]}
                # The administrator's overlay for this runtime type: its locale and
                # whatever options the product itself exposes. The config object is
                # the runtime vendor's schema, not ours, so its fields are preserved
                # rather than pruned — the alternative is silently dropping settings
                # an operator can see in their own screen.
                runtimeSettings:
                  type: object
                  properties:
                    fingerprint: {type: string, maxLength: 64}
                    config:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    env:
                      type: array
                      maxItems: 32
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}
                          value: {type: string, maxLength: 2048}
                lifecycle:
                  type: object
                  required: [desiredState]
                  properties:
                    desiredState: {type: string, enum: [Running, Stopped]}
                    autoRestart: {type: boolean}
                    idleTimeoutSeconds: {type: integer, minimum: 0}
            status:
              type: object
              properties:
                phase: {type: string}
                podName: {type: string}
                nodeName: {type: string}
                endpoint: {type: string}
                restartCount: {type: integer, minimum: 0}
                failureReason: {type: string}
                observedGeneration: {type: integer, format: int64}
                lastTransitionTime: {type: string}
