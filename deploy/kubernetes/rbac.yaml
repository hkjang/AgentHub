apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenthub
  namespace: agent-platform-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenthub-operator
  namespace: agent-platform-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agenthub-control-plane
rules:
  - apiGroups: [agenthub.io]
    resources: [agentruntimes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agenthub.io]
    resources: [agentruntimes/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agenthub-operator
rules:
  - apiGroups: [agenthub.io]
    resources: [agentruntimes]
    verbs: [get, list, watch]
  - apiGroups: [agenthub.io]
    resources: [agentruntimes/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, secrets, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agenthub-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agenthub-control-plane
subjects:
  - kind: ServiceAccount
    name: agenthub
    namespace: agent-platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agenthub-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agenthub-operator
subjects:
  - kind: ServiceAccount
    name: agenthub-operator
    namespace: agent-platform-system
