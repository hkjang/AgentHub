apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenthub
  namespace: agent-platform-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenthub-operator
  namespace: agent-platform-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agenthub-control-plane
rules:
  - apiGroups: [agenthub.io]
    resources: [agentruntimes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agenthub.io]
    resources: [agentruntimes/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  # Running a task as the runtime's own command-line agent means executing it in
  # the Pod, which is the only way to reach an agent that has no API. It is the
  # narrowest addition that makes an unattended Qwen Code run possible, and it
  # grants nothing this role could not already do by other means: it already
  # creates the Pods and decides what they run. A deployment that never uses the
  # `cli` runner can remove this rule — those tasks then fail with a permission
  # error rather than doing anything unexpected.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agenthub-operator
rules:
  - apiGroups: [agenthub.io]
    resources: [agentruntimes]
    verbs: [get, list, watch]
  - apiGroups: [agenthub.io]
    resources: [agentruntimes/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, secrets, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Granting a runtime read-only access to the cluster, which an administrator
  # turns on per security profile. The operator may create the binding and may
  # bind exactly one role — Kubernetes' own read-only `view`, which cannot read
  # Secrets. It cannot bind anything else, so this permission cannot be used to
  # grant more than was designed.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    # list, because the operator sweeps grants whose runtime is gone: Kubernetes
    # will not garbage-collect a cluster-scoped object owned by a namespaced one.
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["view"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agenthub-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agenthub-control-plane
subjects:
  - kind: ServiceAccount
    name: agenthub
    namespace: agent-platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agenthub-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agenthub-operator
subjects:
  - kind: ServiceAccount
    name: agenthub-operator
    namespace: agent-platform-system
