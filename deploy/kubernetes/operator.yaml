apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-operator
  namespace: agent-platform-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: agenthub-operator}
  template:
    metadata:
      labels: {app: agenthub-operator}
    spec:
      serviceAccountName: agenthub-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: agenthub:v0.58.0
          imagePullPolicy: IfNotPresent
          command: [/app/agenthub-operator]
          env:
            # Where a Pod's MCP gateway asks for a tool approval. It only matters
            # for agents with a gated tool, and the default is the Service the
            # manifests in this directory create.
            - {name: AGENTHUB_CONTROL_PLANE_URL, value: "http://agenthub.agent-platform-system.svc:8080"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
