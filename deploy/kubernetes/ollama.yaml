  name: ollama
  namespace: agent-platform-system
spec:
  ports:
    - port: 11434
      targetPort: 11434
      name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: agent-platform-system
subsets:
  - addresses:
      - ip: 192.168.67.3
    ports:
      - port: 11434
        name: http
