name: agenthub-offline

# PostgreSQL is deliberately not a service in this bundle. Provision and
# operate it separately, then set AGENTHUB_POSTGRES_DSN before running Compose.
services:
  agenthub:
    image: "agenthub:${AGENTHUB_VERSION:?set AGENTHUB_VERSION, for example v0.232.0}"
    restart: unless-stopped
    environment:
      AGENTHUB_POSTGRES_DSN: "${AGENTHUB_POSTGRES_DSN:?external PostgreSQL DSN is required}"
      AGENTHUB_BOOTSTRAP_ADMIN: "${AGENTHUB_BOOTSTRAP_ADMIN:?bootstrap administrator is required}"
      AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: "${AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD:?bootstrap password is required}"
      AGENTHUB_ENCRYPTION_KEY: "${AGENTHUB_ENCRYPTION_KEY:?32-byte encryption key is required}"
    ports:
      - "${AGENTHUB_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [frontend, database]

  agenthub-worker:
    image: "agenthub:${AGENTHUB_VERSION:?set AGENTHUB_VERSION, for example v0.232.0}"
    entrypoint: [/app/agenthub-worker]
    restart: unless-stopped
    depends_on: [agenthub]
    environment:
      AGENTHUB_POSTGRES_DSN: "${AGENTHUB_POSTGRES_DSN:?external PostgreSQL DSN is required}"
      AGENTHUB_BOOTSTRAP_ADMIN: "${AGENTHUB_BOOTSTRAP_ADMIN:?bootstrap administrator is required}"
      AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: "${AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD:?bootstrap password is required}"
      AGENTHUB_ENCRYPTION_KEY: "${AGENTHUB_ENCRYPTION_KEY:?32-byte encryption key is required}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [database]

networks:
  frontend: {}
  database: {}
