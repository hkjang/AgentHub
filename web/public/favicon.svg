<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Main Shield & Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="hub-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Background Cyber Circuit Grid & Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Left Apex Arm (Cyan to Blue) -->
  <path d="M 256 80 L 108 388 L 168 388 L 256 196 Z" fill="url(#primary-grad)" filter="url(#glow)"/>

  <!-- Right Apex Arm (Indigo to Purple) -->
  <path d="M 256 80 L 404 388 L 344 388 L 256 196 Z" fill="url(#purple-grad)" filter="url(#glow)"/>

  <!-- Central Bridge Crossbar (Connecting Link) -->
  <path d="M 172 300 L 340 300 L 320 348 L 192 348 Z" fill="url(#primary-grad)" opacity="0.9"/>

  <!-- Central Agent Core Hub (Glowing Diamond / Cube) -->
  <g transform="translate(256, 256)">
    <!-- Rotating Node Ring Elements -->
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="url(#emerald-grad)" stroke-width="4" filter="url(#hub-glow)"/>
    <circle cx="0" cy="0" r="22" fill="url(#emerald-grad)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>

    <!-- Orbital Agent Satellites -->
    <circle cx="-100" cy="-60" r="8" fill="#38bdf8" filter="url(#hub-glow)"/>
    <line x1="-100" y1="-60" x2="-35" y2="-20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

    <circle cx="100" cy="-60" r="8" fill="#a855f7" filter="url(#hub-glow)"/>
    <line x1="100" y1="-60" x2="35" y2="-20" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

    <circle cx="0" cy="115" r="8" fill="#34d399" filter="url(#hub-glow)"/>
    <line x1="0" y1="115" x2="0" y2="45" stroke="#34d399" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
  </g>

  <!-- Top Apex Beacon Dot -->
  <circle cx="256" cy="80" r="12" fill="#ffffff" filter="url(#hub-glow)"/>
  <circle cx="256" cy="80" r="6" fill="#38bdf8"/>
</svg>
